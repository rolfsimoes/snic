name: R-CMD-check

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

jobs:
  check-pr-open:
    runs-on: ubuntu-latest
    outputs:
      has_pr: ${{ steps.find-pr.outputs.has_pr }}
    steps:
      - id: find-pr
        uses: actions/github-script@v7
        with:
          script: |
            const isDevPush = context.eventName === 'push' && context.ref === 'refs/heads/dev';
            if (!isDevPush) {
              core.setOutput('has_pr', false);
              return;
            }
            const head = `${context.repo.owner}:dev`;
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head,
              base: 'main',
            });
            core.setOutput('has_pr', pulls.length > 0);

  R-CMD-check:
    needs: check-pr-open
    if: github.event_name != 'push' || needs.check-pr-open.outputs.has_pr != 'true'
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
          - {os: macos-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          cache: false
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
