name: test-coverage

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

jobs:
  check-pr-open:
    runs-on: ubuntu-latest
    outputs:
      has_pr: ${{ steps.find-pr.outputs.has_pr }}
    steps:
      - id: find-pr
        uses: actions/github-script@v7
        with:
          script: |
            const isDevPush = context.eventName === 'push' && context.ref === 'refs/heads/dev';
            if (!isDevPush) {
              core.setOutput('has_pr', false);
              return;
            }
            const head = `${context.repo.owner}:dev`;
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head,
              base: 'main',
            });
            core.setOutput('has_pr', pulls.length > 0);

  coverage:
    needs: check-pr-open
    if: github.event_name != 'push' || needs.check-pr-open.outputs.has_pr != 'true'
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
          needs: coverage
          cache: false
      - name: Run test coverage
        run: |
          cov <- covr::package_coverage()
          covr::to_cobertura(cov, "coverage.xml")
        shell: Rscript {0}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: coverage.xml
